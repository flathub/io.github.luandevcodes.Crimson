app-id: io.github.luandevcodes.Crimson
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: crimson

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri

cleanup:
  - /share/bash-completion
  - /share/doc
  - /share/fish
  - /share/man
  - /share/zsh
build-options:
  env:
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_DISABLE_NUMPY: '1'

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - python3-requirements.yaml

  - name: crimson
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/LuanDevCodes/Crimson.git
        tag: V.4.1.0
        commit: 1131922e6bf6d934c3a2250a14f76814fb6293f2
        x-checker-data:
          type: git
          tag-pattern: ^V\.([\d.]+)$